# Builds, signs and publishes a release of a Coder Terraform provider. On the push of a v* tag,
# the tag's release.yml calls main's copy of this file, not the tag's own. The other providers
# (coder/terraform-provider-coderd, coder/terraform-provider-envbuilder) call the same copy, so
# the steps that sign exist once. A tag on a commit from before this file runs that commit's
# release.yml instead, which coder/gcp does not let sign.
name: release-sign
on:
  workflow_call:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The release environment (coder/github-org-terraform): v* tags only, and a second release
    # manager approves each run. coder/gcp only lets this job, in this environment, on a release
    # tag, act as the signer.
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # workload identity federation to the Cloud KMS signing key
    env:
      # The signing key never leaves Cloud KMS (coder/gcp:
      # projects/production/coder-release-signing/terraform_provider.tf).
      GPGKMS_KEY: projects/coder-release-signing/locations/us-central1/keyRings/release-signing/cryptoKeys/gpg-terraform-provider/cryptoKeyVersions/1
      GPGKMS_WIF_PROVIDER: projects/720429782538/locations/global/workloadIdentityPools/github-release-signing/providers/coder-terraform-provider
      GPGKMS_SERVICE_ACCOUNT: terraform-provider-signer@coder-release-signing.iam.gserviceaccount.com
      # The OpenPGP identity derived from the KMS key. GPGKMS_CREATED is part of the fingerprint
      # registered with the Terraform Registry: never change it. No expiry, so `terraform init`
      # keeps verifying old releases.
      GPGKMS_NAME: Coder Terraform Provider Signing Key
      GPGKMS_EMAIL: security@coder.com
      GPGKMS_CREATED: "2026-11-17T00:00:00Z"
      GPGKMS_VERSION: 52ee1a995f55f6fcb51f3c0a3ac20ed634120806 # github.com/coder/gpgkms v0.1.2
      # Committed public key; the derived key must match it byte for byte.
      GPGKMS_PUBLIC_KEY: .github/release-signing-key.asc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag chooses the commit, so this runs before any of that commit's code: only a commit
      # that went through review on main may be released.
      - name: Require a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      # The signing script comes from this file's own commit, not from the checkout above, which
      # is the caller's. The public key is the caller's own committed copy.
      - name: Checkout the signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-sign
          sparse-checkout: scripts/release-signing-key.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Moved out of the workspace: goreleaser refuses to release from a tree with untracked
      # files.
      - name: Install the signing script
        run: |
          mv .release-sign "${RUNNER_TEMP}/release-sign"
          echo "${RUNNER_TEMP}/release-sign/scripts" >> "${GITHUB_PATH}"

      # Same as coder/coder's release signing. The credentials file fetches a fresh GitHub OIDC
      # token whenever the Google client needs one, so signing late in the goreleaser run still
      # works. Not exported: only the steps that run gpgkms get it, explicitly. The file lands in
      # the workspace as gha-creds-*.json (gitignored, or goreleaser sees a dirty tree) and the
      # action deletes it when the job ends.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GPGKMS_WIF_PROVIDER }}
          service_account: ${{ env.GPGKMS_SERVICE_ACCOUNT }}
          export_environment_variables: false

      # A caller's .gitignore does not have to list the credentials file.
      - name: Ignore the credentials file
        run: echo 'gha-creds-*.json' >> .git/info/exclude

      - name: Install gpgkms
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/coder/gpgkms/cmd/gpgkms@${GPGKMS_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # The public key derived from Cloud KMS must equal the committed one, which is what the
      # Terraform Registry has; otherwise the job stops before anything is published.
      - name: Check the signing key
        run: release-signing-key.sh check
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp.outputs.credentials_file_path }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp.outputs.credentials_file_path }}
